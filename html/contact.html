<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 | Irum Academy</title>
    <meta name="description" content="이룸아카데미에 궁금한 점을 문의하세요">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Page Hero -->
    <section class="page-hero apply-hero">
        <div class="container">
            <div class="page-hero-content reveal-up">
                <h1 class="page-hero-title">문의하기</h1>
                <p class="page-hero-subtitle">교육 과정, 협업, 기타 궁금한 점을 남겨주세요.</p>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <section class="section">
            <div class="container apply-container">

                <form id="contact-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="name">이름 *</label>
                            <input type="text" class="form-input" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">이메일 *</label>
                            <input type="email" class="form-input" id="email" name="email" required
                                placeholder="reply@example.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="category">문의 유형</label>
                        <select class="form-input" id="category" name="category">
                            <option value="general">일반 문의</option>
                            <option value="institution">대학·기관 교육 문의</option>
                            <option value="workshop">강사 워크샵 문의</option>
                            <option value="partnership">제휴·협업</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="message">문의 내용 *</label>
                        <textarea class="form-input" id="message" name="message" rows="6" required
                            placeholder="문의하실 내용을 자유롭게 적어주세요."></textarea>
                    </div>

                    <p class="form-error" id="form-error" hidden></p>

                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">문의 보내기</button>
                </form>

                <!-- Success -->
                <div id="contact-success" class="apply-success" hidden>
                    <h2>문의가 접수되었습니다</h2>
                    <p>확인 후 이메일로 답변드리겠습니다. 감사합니다.</p>
                    <a href="../index.html" class="btn btn-outline">홈으로 돌아가기</a>
                </div>

                <div class="contact-direct">
                    <p>이메일로 직접 문의하셔도 됩니다 — <a href="mailto:irum.ceo@gmail.com">irum.ceo@gmail.com</a></p>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/supabase-client.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        (function () {
            const form = document.getElementById('contact-form');
            const errorEl = document.getElementById('form-error');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                errorEl.hidden = true;

                const name = form.name.value.trim();
                const email = form.email.value.trim();
                const message = form.message.value.trim();
                if (!name || !email || !message) {
                    errorEl.textContent = '이름, 이메일, 문의 내용은 필수 입력입니다.';
                    errorEl.hidden = false;
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '전송 중...';

                const result = await submitInquiry({
                    name: name,
                    email: email,
                    category: form.category.value,
                    message: message
                });

                if (result.ok) {
                    form.hidden = true;
                    document.getElementById('contact-success').hidden = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    errorEl.textContent = '전송에 실패했습니다. 잠시 후 다시 시도하시거나 irum.ceo@gmail.com으로 연락주세요.';
                    errorEl.hidden = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '문의 보내기';
                }
            });
        })();
    </script>
</body>

</html>

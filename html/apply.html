<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육 신청 | Irum Academy</title>
    <meta name="description" content="대학·기관 교육 및 강사 워크샵 신청">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Page Hero -->
    <section class="page-hero apply-hero">
        <div class="container">
            <div class="page-hero-content reveal-up">
                <h1 class="page-hero-title">교육 신청</h1>
                <p class="page-hero-subtitle">신청 내용을 남겨주시면 담당자가 1~2일 내에 연락드립니다.</p>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <section class="section">
            <div class="container apply-container">

                <form id="apply-form" novalidate>
                    <!-- Track Selection -->
                    <div class="form-group">
                        <label class="form-label">신청 유형 *</label>
                        <div class="track-selector">
                            <label class="track-option" id="track-institution-label">
                                <input type="radio" name="track" value="institution" checked>
                                <span class="track-option-title">대학·기관 교육</span>
                                <span class="track-option-desc">대학, 공공기관, 기업 대상 맞춤 강의</span>
                            </label>
                            <label class="track-option" id="track-workshop-label">
                                <input type="radio" name="track" value="workshop">
                                <span class="track-option-title">강사 워크샵</span>
                                <span class="track-option-desc">강사를 위한 집중교육 워크샵</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="org-group">
                        <label class="form-label" for="org_name">기관/학교명</label>
                        <input type="text" class="form-input" id="org_name" name="org_name" placeholder="예: OO대학교 교수학습센터">
                    </div>

                    <div class="form-group" id="program-group">
                        <label class="form-label" for="program_slug">희망 프로그램</label>
                        <select class="form-input" id="program_slug" name="program_slug">
                            <option value="">선택해주세요 (미정이어도 괜찮습니다)</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contact_name">담당자/신청자 이름 *</label>
                            <input type="text" class="form-input" id="contact_name" name="contact_name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">연락처</label>
                            <input type="tel" class="form-input" id="phone" name="phone" placeholder="010-0000-0000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">이메일 *</label>
                        <input type="email" class="form-input" id="email" name="email" required placeholder="reply@example.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="headcount">예상 인원</label>
                            <input type="number" class="form-input" id="headcount" name="headcount" min="1" placeholder="예: 30">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="preferred_date">희망 일정</label>
                            <input type="text" class="form-input" id="preferred_date" name="preferred_date" placeholder="예: 2026년 9월 중, 협의 가능">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="message">요청사항</label>
                        <textarea class="form-input" id="message" name="message" rows="5"
                            placeholder="교육 목적, 대상, 원하시는 내용을 자유롭게 적어주세요."></textarea>
                    </div>

                    <p class="form-error" id="form-error" hidden></p>

                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">신청하기</button>
                </form>

                <!-- Success -->
                <div id="apply-success" class="apply-success" hidden>
                    <h2>신청이 접수되었습니다</h2>
                    <p>담당자가 확인 후 남겨주신 연락처로 회신드리겠습니다. 감사합니다.</p>
                    <a href="../index.html" class="btn btn-outline">홈으로 돌아가기</a>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/courses-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/content-client.js"></script>
    <script src="../js/components.js"></script>
    <script>
        (function () {
            const form = document.getElementById('apply-form');
            const programSelect = document.getElementById('program_slug');
            const programGroup = document.getElementById('program-group');
            const orgInput = document.getElementById('org_name');
            const errorEl = document.getElementById('form-error');
            const submitBtn = document.getElementById('submit-btn');

            // 프로그램 옵션 채우기
            function fillPrograms(list) {
                const keep = programSelect.value;
                while (programSelect.options.length > 1) programSelect.remove(1);
                list.forEach(function (c) {
                    const opt = document.createElement('option');
                    opt.value = c.slug;
                    opt.textContent = c.title;
                    programSelect.appendChild(opt);
                });
                if (keep) programSelect.value = keep;
            }
            fillPrograms(COURSES_DATA);
            fetchCourses().then(function (list) { if (list) fillPrograms(list); });

            // URL 파라미터 반영 (?track=institution&program=slug)
            const params = new URLSearchParams(window.location.search);
            const trackParam = params.get('track');
            if (trackParam === 'workshop' || trackParam === 'institution') {
                form.elements['track'].value = trackParam;
            }
            const programParam = params.get('program');
            if (programParam) {
                programSelect.value = programParam;
            }

            // 트랙에 따라 필드 조정
            function updateTrackFields() {
                const track = form.elements['track'].value;
                const isInstitution = track === 'institution';
                programGroup.hidden = !isInstitution;
                orgInput.placeholder = isInstitution
                    ? '예: OO대학교 교수학습센터'
                    : '소속 (프리랜서인 경우 비워두셔도 됩니다)';
                document.querySelectorAll('.track-option').forEach(function (el) {
                    el.classList.toggle('selected', el.querySelector('input').checked);
                });
            }
            form.querySelectorAll('input[name="track"]').forEach(function (r) {
                r.addEventListener('change', updateTrackFields);
            });
            updateTrackFields();

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                errorEl.hidden = true;

                const name = form.contact_name.value.trim();
                const email = form.email.value.trim();
                if (!name || !email) {
                    errorEl.textContent = '이름과 이메일은 필수 입력입니다.';
                    errorEl.hidden = false;
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '제출 중...';

                const data = {
                    track: form.elements['track'].value,
                    org_name: form.org_name.value.trim() || null,
                    contact_name: name,
                    email: email,
                    phone: form.phone.value.trim() || null,
                    program_slug: form.elements['track'].value === 'institution'
                        ? (form.program_slug.value || null) : null,
                    headcount: form.headcount.value ? parseInt(form.headcount.value, 10) : null,
                    preferred_date: form.preferred_date.value.trim() || null,
                    message: form.message.value.trim() || null
                };

                const result = await submitApplication(data);

                if (result.ok) {
                    form.hidden = true;
                    document.getElementById('apply-success').hidden = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    errorEl.textContent = '제출에 실패했습니다. 잠시 후 다시 시도하시거나 irum.ceo@gmail.com으로 연락주세요.';
                    errorEl.hidden = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '신청하기';
                }
            });
        })();
    </script>
</body>

</html>

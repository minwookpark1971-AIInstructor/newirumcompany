<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 | Irum Academy</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="../css/main.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #fafafa;
        }

        .admin-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--spacing-8) var(--spacing-4) var(--spacing-16);
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-8);
        }

        .admin-header h1 {
            font-size: var(--font-size-2xl);
        }

        .admin-header .admin-user {
            display: flex;
            align-items: center;
            gap: var(--spacing-4);
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }

        /* Login */
        .admin-login {
            max-width: 380px;
            margin: 15vh auto 0;
            padding: var(--spacing-8);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
        }

        .admin-login h1 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-6);
            text-align: center;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: var(--spacing-2);
            margin-bottom: var(--spacing-6);
            border-bottom: 1px solid var(--border);
        }

        .admin-tab {
            padding: var(--spacing-3) var(--spacing-5);
            border: none;
            background: none;
            font-size: var(--font-size-base);
            font-family: var(--font-sans);
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .admin-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 700;
        }

        /* Toolbar */
        .admin-toolbar {
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
            margin-bottom: var(--spacing-4);
            flex-wrap: wrap;
        }

        .admin-toolbar select {
            padding: var(--spacing-2) var(--spacing-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            background: #fff;
        }

        .admin-count {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Table */
        .admin-table-wrap {
            overflow-x: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size-sm);
        }

        .admin-table th,
        .admin-table td {
            padding: var(--spacing-3) var(--spacing-4);
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            vertical-align: top;
        }

        .admin-table th {
            background: #fafafa;
            font-weight: 600;
            color: var(--text-muted);
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table td.msg-cell {
            max-width: 320px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-select {
            padding: 2px 6px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            font-family: var(--font-sans);
            font-size: var(--font-size-xs);
        }

        .status-new { background: #eff6ff; }
        .status-contacted { background: #fffbeb; }
        .status-done { background: #ecfdf5; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 600;
        }

        .badge-institution { background: #eff6ff; color: #1d4ed8; }
        .badge-workshop { background: #f5f3ff; color: #6d28d9; }

        .admin-empty {
            padding: var(--spacing-12);
            text-align: center;
            color: var(--text-muted);
        }

        .form-error { color: var(--danger); font-size: var(--font-size-sm); margin-bottom: var(--spacing-4); }
            .admin-note { color: #666; font-size: 14px; margin: 0 0 12px; }
        .editor-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .editor-bar select { min-width: 260px; max-width: 100%; }
        .editor-text { width: 100%; min-height: 360px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.5; white-space: pre; }
        .editor-sub { font-size: 15px; margin: 24px 0 8px; }
        .rev-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #e5e5e5; font-size: 13px; flex-wrap: wrap; }
        .rev-row span { flex: 1; min-width: 200px; }
    </style>
</head>

<body>
    <!-- Login View -->
    <div id="login-view" class="admin-login" hidden>
        <h1>관리자 로그인</h1>
        <div id="login-form">
            <p class="admin-note">관리자 계정(Google)으로 로그인해 주세요.</p>
            <p class="form-error" id="login-error" hidden></p>
            <button type="button" class="btn btn-primary btn-block" id="google-login">Google로 로그인</button>
        </div>
    </div>

    <!-- Admin View -->
    <div id="admin-view" class="admin-wrap" hidden>
        <div class="admin-header">
            <h1>이룸아카데미 관리자</h1>
            <div class="admin-user">
                <span id="admin-email"></span>
                <button class="btn btn-outline btn-sm" id="logout-btn">로그아웃</button>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="applications">교육 신청</button>
            <button class="admin-tab" data-tab="inquiries">문의</button>
            <button class="admin-tab" data-tab="editor">사이트 편집</button>
        </div>

        <div id="editor-panel" hidden>
            <p class="admin-note">메인 문구·헤더/푸터·프로그램 데이터를 JSON으로 편집합니다. 저장하면 사이트에 바로 반영되고, 이전 값은 변경 이력에 남아 되돌릴 수 있습니다.</p>
            <div class="editor-bar">
                <select id="editor-item"></select>
                <button class="btn btn-primary btn-sm" id="editor-save">저장</button>
                <span class="admin-count" id="editor-msg"></span>
            </div>
            <textarea id="editor-text" class="form-input editor-text" spellcheck="false"></textarea>
            <h3 class="editor-sub">변경 이력 (최근 10건)</h3>
            <div id="editor-revs"></div>
        </div>

        <div class="admin-toolbar" id="list-toolbar">
            <select id="track-filter">
                <option value="">전체 유형</option>
                <option value="institution">대학·기관 교육</option>
                <option value="workshop">강사 워크샵</option>
            </select>
            <select id="status-filter">
                <option value="">전체 상태</option>
                <option value="new">신규</option>
                <option value="contacted">연락함</option>
                <option value="done">완료</option>
            </select>
            <button class="btn btn-outline btn-sm" id="refresh-btn">새로고침</button>
            <button class="btn btn-outline btn-sm" id="csv-btn">CSV 내보내기</button>
            <span class="admin-count" id="row-count"></span>
        </div>

        <div class="admin-table-wrap" id="list-wrap">
            <table class="admin-table" id="data-table"></table>
            <div class="admin-empty" id="empty-msg" hidden>데이터가 없습니다.</div>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script>
        (function () {
            const STATUS_LABELS = { new: '신규', contacted: '연락함', done: '완료' };
            const TRACK_LABELS = { institution: '대학·기관', workshop: '강사 워크샵' };
            const CATEGORY_LABELS = {
                general: '일반', institution: '대학·기관 교육',
                workshop: '강사 워크샵', partnership: '제휴·협업'
            };

            let currentTab = 'applications';
            let currentRows = [];

            const loginView = document.getElementById('login-view');
            const adminView = document.getElementById('admin-view');
            const trackFilter = document.getElementById('track-filter');

            // ---------- Auth ----------
            async function checkSession() {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    if (!(await verifyAdmin())) return;
                    showAdmin(session.user.email);
                } else {
                    loginView.hidden = false;
                    adminView.hidden = true;
                }
            }

            // 이 프로젝트는 이메일 로그인이 꺼져 있고 Google 로그인만 쓴다. 로그인 후 이 페이지로 돌아와 checkSession 이 이어서 처리한다.
            document.getElementById('google-login').addEventListener('click', async function () {
                const errorEl = document.getElementById('login-error');
                errorEl.hidden = true;
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: location.origin + location.pathname }
                });
                if (error) {
                    errorEl.textContent = '로그인에 실패했습니다: ' + error.message;
                    errorEl.hidden = false;
                }
            });

            // 관리자 등록 여부 확인 (public.is_admin() RPC). 아니면 로그아웃시키고 안내.
            async function verifyAdmin() {
                const { data, error } = await supabaseClient.rpc('is_admin');
                if (!error && data === true) return true;
                await supabaseClient.auth.signOut();
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = '관리자로 등록되지 않은 계정입니다.';
                errorEl.hidden = false;
                loginView.hidden = false;
                adminView.hidden = true;
                return false;
            }

            document.getElementById('logout-btn').addEventListener('click', async function () {
                await supabaseClient.auth.signOut();
                window.location.reload();
            });

            function showAdmin(email) {
                loginView.hidden = true;
                adminView.hidden = false;
                document.getElementById('admin-email').textContent = email;
                loadData();
            }

            // ---------- Data ----------
            async function loadData() {
                const table = 'site_' + currentTab;
                let query = supabaseClient.from(table).select('*').order('created_at', { ascending: false });

                if (currentTab === 'applications' && trackFilter.value) {
                    query = query.eq('track', trackFilter.value);
                }
                const statusFilter = document.getElementById('status-filter').value;
                if (statusFilter) {
                    query = query.eq('status', statusFilter);
                }

                const { data, error } = await query;
                if (error) {
                    alert('데이터 조회 실패: ' + error.message);
                    return;
                }
                currentRows = data || [];
                renderTable();
            }

            function fmtDate(iso) {
                const d = new Date(iso);
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0') + ' ' +
                    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            }

            function esc(s) {
                return s == null ? '' : String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function statusSelectHtml(row) {
                const opts = Object.keys(STATUS_LABELS).map(function (s) {
                    return '<option value="' + s + '"' + (row.status === s ? ' selected' : '') + '>' +
                        STATUS_LABELS[s] + '</option>';
                }).join('');
                return '<select class="status-select status-' + esc(row.status) + '" data-id="' + esc(row.id) + '">' +
                    opts + '</select>';
            }

            function renderTable() {
                const tableEl = document.getElementById('data-table');
                const emptyEl = document.getElementById('empty-msg');
                document.getElementById('row-count').textContent = currentRows.length + '건';

                if (!currentRows.length) {
                    tableEl.innerHTML = '';
                    emptyEl.hidden = false;
                    return;
                }
                emptyEl.hidden = true;

                let html;
                if (currentTab === 'applications') {
                    html = '<thead><tr><th>접수일시</th><th>유형</th><th>기관/소속</th><th>담당자</th>' +
                        '<th>연락처</th><th>이메일</th><th>프로그램</th><th>인원</th><th>희망일정</th>' +
                        '<th>요청사항</th><th>상태</th></tr></thead><tbody>';
                    currentRows.forEach(function (r) {
                        html += '<tr>' +
                            '<td>' + fmtDate(r.created_at) + '</td>' +
                            '<td><span class="badge badge-' + esc(r.track) + '">' + (TRACK_LABELS[r.track] || esc(r.track)) + '</span></td>' +
                            '<td>' + esc(r.org_name) + '</td>' +
                            '<td>' + esc(r.contact_name) + '</td>' +
                            '<td>' + esc(r.phone) + '</td>' +
                            '<td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td>' +
                            '<td>' + esc(r.program_slug) + '</td>' +
                            '<td>' + (r.headcount || '') + '</td>' +
                            '<td>' + esc(r.preferred_date) + '</td>' +
                            '<td class="msg-cell">' + esc(r.message) + '</td>' +
                            '<td>' + statusSelectHtml(r) + '</td>' +
                            '</tr>';
                    });
                } else {
                    html = '<thead><tr><th>접수일시</th><th>이름</th><th>이메일</th><th>유형</th>' +
                        '<th>문의 내용</th><th>상태</th></tr></thead><tbody>';
                    currentRows.forEach(function (r) {
                        html += '<tr>' +
                            '<td>' + fmtDate(r.created_at) + '</td>' +
                            '<td>' + esc(r.name) + '</td>' +
                            '<td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td>' +
                            '<td>' + (CATEGORY_LABELS[r.category] || esc(r.category)) + '</td>' +
                            '<td class="msg-cell">' + esc(r.message) + '</td>' +
                            '<td>' + statusSelectHtml(r) + '</td>' +
                            '</tr>';
                    });
                }
                tableEl.innerHTML = html + '</tbody>';

                tableEl.querySelectorAll('.status-select').forEach(function (sel) {
                    sel.addEventListener('change', async function () {
                        const { error } = await supabaseClient.from('site_' + currentTab)
                            .update({ status: sel.value }).eq('id', sel.dataset.id);
                        if (error) {
                            alert('상태 변경 실패: ' + error.message);
                        } else {
                            sel.className = 'status-select status-' + sel.value;
                        }
                    });
                });
            }

            // ---------- CSV ----------
            document.getElementById('csv-btn').addEventListener('click', function () {
                if (!currentRows.length) return;
                const cols = Object.keys(currentRows[0]);
                const lines = [cols.join(',')];
                currentRows.forEach(function (r) {
                    lines.push(cols.map(function (c) {
                        const v = r[c] == null ? '' : String(r[c]);
                        return '"' + v.replace(/"/g, '""') + '"';
                    }).join(','));
                });
                const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = currentTab + '_' + new Date().toISOString().slice(0, 10) + '.csv';
                a.click();
                URL.revokeObjectURL(a.href);
            });

            // ---------- Site editor ----------
            // content/settings 는 value 컬럼, courses 는 행 전체를 JSON 으로 편집. 권한은 RLS(관리자만 쓰기)가 담보.
            let editorItems = [];
            const editorSel = document.getElementById('editor-item');
            const editorText = document.getElementById('editor-text');
            const editorMsg = document.getElementById('editor-msg');

            function setMsg(t, bad) {
                editorMsg.textContent = t;
                editorMsg.style.color = bad ? '#c0392b' : '';
            }

            async function loadEditorItems() {
                const res = await Promise.all([
                    supabaseClient.from('site_content').select('key'),
                    supabaseClient.from('site_settings').select('key'),
                    supabaseClient.from('site_courses').select('slug,title').order('sort_order')
                ]);
                editorItems = [];
                (res[0].data || []).forEach(function (r) { editorItems.push({ table: 'site_content', pk: 'key', id: r.key, label: '메인 문구 · ' + r.key }); });
                (res[1].data || []).forEach(function (r) { editorItems.push({ table: 'site_settings', pk: 'key', id: r.key, label: '설정 · ' + r.key }); });
                (res[2].data || []).forEach(function (r) { editorItems.push({ table: 'site_courses', pk: 'slug', id: r.slug, label: '프로그램 · ' + r.title }); });
                editorSel.innerHTML = editorItems.map(function (it, i) {
                    return '<option value="' + i + '">' + esc(it.label) + '</option>';
                }).join('');
                if (editorItems.length) loadEditorValue(); else editorText.value = '';
            }

            function currentItem() { return editorItems[Number(editorSel.value)]; }

            function stripManaged(row) {
                const o = Object.assign({}, row);
                delete o.updated_at;
                delete o.updated_by;
                return o;
            }

            async function loadEditorValue() {
                const it = currentItem();
                if (!it) return;
                setMsg('');
                const r = await supabaseClient.from(it.table).select('*').eq(it.pk, it.id).maybeSingle();
                if (r.error || !r.data) { setMsg('불러오기 실패: ' + (r.error ? r.error.message : '없음'), true); return; }
                const val = it.table === 'site_courses' ? stripManaged(r.data) : r.data.value;
                editorText.value = JSON.stringify(val, null, 2);
                loadRevisions(it);
            }

            function looksUnsafe(v) {
                if (typeof v === 'string') {
                    return /<\s*\/?\s*(script|iframe|object|embed|style|link|meta)\b/i.test(v) ||
                        /\bon[a-z]+\s*=/i.test(v) || /javascript\s*:/i.test(v);
                }
                if (Array.isArray(v)) return v.some(looksUnsafe);
                if (v && typeof v === 'object') return Object.keys(v).some(function (k) { return looksUnsafe(v[k]); });
                return false;
            }

            document.getElementById('editor-save').addEventListener('click', async function () {
                const it = currentItem();
                if (!it) return;
                let val;
                try { val = JSON.parse(editorText.value); } catch (e) { setMsg('JSON 형식 오류: ' + e.message, true); return; }
                if (looksUnsafe(val)) { setMsg('스크립트/위험한 HTML 은 저장할 수 없습니다.', true); return; }
                if (it.table === 'site_courses' && val.slug !== it.id) { setMsg('slug 는 바꿀 수 없습니다.', true); return; }
                const row = it.table === 'site_courses' ? val : { key: it.id, value: val };
                const r = await supabaseClient.from(it.table).upsert(row);
                if (r.error) { setMsg('저장 실패: ' + r.error.message, true); return; }
                setMsg('저장되었습니다 ' + new Date().toLocaleTimeString());
                loadRevisions(it);
            });

            editorSel.addEventListener('change', loadEditorValue);

            async function loadRevisions(it) {
                const box = document.getElementById('editor-revs');
                const r = await supabaseClient.from('site_revisions')
                    .select('id,old_value,created_at').eq('table_name', it.table).eq('row_key', it.id)
                    .order('id', { ascending: false }).limit(10);
                const data = r.data;
                if (r.error || !data || !data.length) { box.innerHTML = '<p class="admin-note">이력이 없습니다.</p>'; return; }
                box.innerHTML = data.map(function (x) {
                    return '<div class="rev-row"><span>' + fmtDate(x.created_at) + (x.old_value ? '' : ' · 최초 생성') + '</span>' +
                        (x.old_value ? '<button class="btn btn-outline btn-sm" data-rev="' + x.id + '">이 이전 값으로 되돌리기</button>' : '') + '</div>';
                }).join('');
                box.querySelectorAll('[data-rev]').forEach(function (btn) {
                    btn.addEventListener('click', async function () {
                        const rev = data.find(function (x) { return String(x.id) === btn.dataset.rev; });
                        if (!rev || !confirm('이 시점 이전 값으로 되돌릴까요?')) return;
                        const r2 = await supabaseClient.from(it.table).upsert(rev.old_value);
                        if (r2.error) { setMsg('되돌리기 실패: ' + r2.error.message, true); return; }
                        setMsg('되돌렸습니다');
                        loadEditorValue();
                    });
                });
            }

            // ---------- Tabs & Filters ----------
            document.querySelectorAll('.admin-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('.admin-tab').forEach(function (t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    const isEditor = currentTab === 'editor';
                    document.getElementById('editor-panel').hidden = !isEditor;
                    document.getElementById('list-toolbar').hidden = isEditor;
                    document.getElementById('list-wrap').hidden = isEditor;
                    if (isEditor) { loadEditorItems(); return; }
                    trackFilter.style.display = currentTab === 'applications' ? '' : 'none';
                    loadData();
                });
            });
            trackFilter.addEventListener('change', loadData);
            document.getElementById('status-filter').addEventListener('change', loadData);
            document.getElementById('refresh-btn').addEventListener('click', loadData);

            checkSession();
        })();
    </script>
</body>

</html>

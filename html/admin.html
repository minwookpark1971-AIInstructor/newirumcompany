<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 | Irum Academy</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="../css/main.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #fafafa;
        }

        .admin-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--spacing-8) var(--spacing-4) var(--spacing-16);
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-8);
        }

        .admin-header h1 {
            font-size: var(--font-size-2xl);
        }

        .admin-header .admin-user {
            display: flex;
            align-items: center;
            gap: var(--spacing-4);
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }

        /* Login */
        .admin-login {
            max-width: 380px;
            margin: 15vh auto 0;
            padding: var(--spacing-8);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
        }

        .admin-login h1 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-6);
            text-align: center;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: var(--spacing-2);
            margin-bottom: var(--spacing-6);
            border-bottom: 1px solid var(--border);
        }

        .admin-tab {
            padding: var(--spacing-3) var(--spacing-5);
            border: none;
            background: none;
            font-size: var(--font-size-base);
            font-family: var(--font-sans);
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .admin-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 700;
        }

        /* Toolbar */
        .admin-toolbar {
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
            margin-bottom: var(--spacing-4);
            flex-wrap: wrap;
        }

        .admin-toolbar select {
            padding: var(--spacing-2) var(--spacing-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            background: #fff;
        }

        .admin-count {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Table */
        .admin-table-wrap {
            overflow-x: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size-sm);
        }

        .admin-table th,
        .admin-table td {
            padding: var(--spacing-3) var(--spacing-4);
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            vertical-align: top;
        }

        .admin-table th {
            background: #fafafa;
            font-weight: 600;
            color: var(--text-muted);
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table td.msg-cell {
            max-width: 320px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-select {
            padding: 2px 6px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            font-family: var(--font-sans);
            font-size: var(--font-size-xs);
        }

        .status-new { background: #eff6ff; }
        .status-contacted { background: #fffbeb; }
        .status-done { background: #ecfdf5; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 600;
        }

        .badge-institution { background: #eff6ff; color: #1d4ed8; }
        .badge-workshop { background: #f5f3ff; color: #6d28d9; }

        .admin-empty {
            padding: var(--spacing-12);
            text-align: center;
            color: var(--text-muted);
        }

        .form-error { color: var(--danger); font-size: var(--font-size-sm); margin-bottom: var(--spacing-4); }
    </style>
</head>

<body>
    <!-- Login View -->
    <div id="login-view" class="admin-login" hidden>
        <h1>관리자 로그인</h1>
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">이메일</label>
                <input type="email" class="form-input" id="login-email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">비밀번호</label>
                <input type="password" class="form-input" id="login-password" required autocomplete="current-password">
            </div>
            <p class="form-error" id="login-error" hidden></p>
            <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </form>
    </div>

    <!-- Admin View -->
    <div id="admin-view" class="admin-wrap" hidden>
        <div class="admin-header">
            <h1>이룸아카데미 관리자</h1>
            <div class="admin-user">
                <span id="admin-email"></span>
                <button class="btn btn-outline btn-sm" id="logout-btn">로그아웃</button>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="applications">교육 신청</button>
            <button class="admin-tab" data-tab="inquiries">문의</button>
        </div>

        <div class="admin-toolbar">
            <select id="track-filter">
                <option value="">전체 유형</option>
                <option value="institution">대학·기관 교육</option>
                <option value="workshop">강사 워크샵</option>
            </select>
            <select id="status-filter">
                <option value="">전체 상태</option>
                <option value="new">신규</option>
                <option value="contacted">연락함</option>
                <option value="done">완료</option>
            </select>
            <button class="btn btn-outline btn-sm" id="refresh-btn">새로고침</button>
            <button class="btn btn-outline btn-sm" id="csv-btn">CSV 내보내기</button>
            <span class="admin-count" id="row-count"></span>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table" id="data-table"></table>
            <div class="admin-empty" id="empty-msg" hidden>데이터가 없습니다.</div>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script>
        (function () {
            const STATUS_LABELS = { new: '신규', contacted: '연락함', done: '완료' };
            const TRACK_LABELS = { institution: '대학·기관', workshop: '강사 워크샵' };
            const CATEGORY_LABELS = {
                general: '일반', institution: '대학·기관 교육',
                workshop: '강사 워크샵', partnership: '제휴·협업'
            };

            let currentTab = 'applications';
            let currentRows = [];

            const loginView = document.getElementById('login-view');
            const adminView = document.getElementById('admin-view');
            const trackFilter = document.getElementById('track-filter');

            // ---------- Auth ----------
            async function checkSession() {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    showAdmin(session.user.email);
                } else {
                    loginView.hidden = false;
                    adminView.hidden = true;
                }
            }

            document.getElementById('login-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const errorEl = document.getElementById('login-error');
                errorEl.hidden = true;
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: document.getElementById('login-email').value.trim(),
                    password: document.getElementById('login-password').value
                });
                if (error) {
                    errorEl.textContent = '로그인에 실패했습니다: ' + error.message;
                    errorEl.hidden = false;
                    return;
                }
                showAdmin(data.user.email);
            });

            document.getElementById('logout-btn').addEventListener('click', async function () {
                await supabaseClient.auth.signOut();
                window.location.reload();
            });

            function showAdmin(email) {
                loginView.hidden = true;
                adminView.hidden = false;
                document.getElementById('admin-email').textContent = email;
                loadData();
            }

            // ---------- Data ----------
            async function loadData() {
                const table = currentTab;
                let query = supabaseClient.from(table).select('*').order('created_at', { ascending: false });

                if (table === 'applications' && trackFilter.value) {
                    query = query.eq('track', trackFilter.value);
                }
                const statusFilter = document.getElementById('status-filter').value;
                if (statusFilter) {
                    query = query.eq('status', statusFilter);
                }

                const { data, error } = await query;
                if (error) {
                    alert('데이터 조회 실패: ' + error.message);
                    return;
                }
                currentRows = data || [];
                renderTable();
            }

            function fmtDate(iso) {
                const d = new Date(iso);
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0') + ' ' +
                    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            }

            function esc(s) {
                return s == null ? '' : String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function statusSelectHtml(row) {
                const opts = Object.keys(STATUS_LABELS).map(function (s) {
                    return '<option value="' + s + '"' + (row.status === s ? ' selected' : '') + '>' +
                        STATUS_LABELS[s] + '</option>';
                }).join('');
                return '<select class="status-select status-' + esc(row.status) + '" data-id="' + esc(row.id) + '">' +
                    opts + '</select>';
            }

            function renderTable() {
                const tableEl = document.getElementById('data-table');
                const emptyEl = document.getElementById('empty-msg');
                document.getElementById('row-count').textContent = currentRows.length + '건';

                if (!currentRows.length) {
                    tableEl.innerHTML = '';
                    emptyEl.hidden = false;
                    return;
                }
                emptyEl.hidden = true;

                let html;
                if (currentTab === 'applications') {
                    html = '<thead><tr><th>접수일시</th><th>유형</th><th>기관/소속</th><th>담당자</th>' +
                        '<th>연락처</th><th>이메일</th><th>프로그램</th><th>인원</th><th>희망일정</th>' +
                        '<th>요청사항</th><th>상태</th></tr></thead><tbody>';
                    currentRows.forEach(function (r) {
                        html += '<tr>' +
                            '<td>' + fmtDate(r.created_at) + '</td>' +
                            '<td><span class="badge badge-' + esc(r.track) + '">' + (TRACK_LABELS[r.track] || esc(r.track)) + '</span></td>' +
                            '<td>' + esc(r.org_name) + '</td>' +
                            '<td>' + esc(r.contact_name) + '</td>' +
                            '<td>' + esc(r.phone) + '</td>' +
                            '<td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td>' +
                            '<td>' + esc(r.program_slug) + '</td>' +
                            '<td>' + (r.headcount || '') + '</td>' +
                            '<td>' + esc(r.preferred_date) + '</td>' +
                            '<td class="msg-cell">' + esc(r.message) + '</td>' +
                            '<td>' + statusSelectHtml(r) + '</td>' +
                            '</tr>';
                    });
                } else {
                    html = '<thead><tr><th>접수일시</th><th>이름</th><th>이메일</th><th>유형</th>' +
                        '<th>문의 내용</th><th>상태</th></tr></thead><tbody>';
                    currentRows.forEach(function (r) {
                        html += '<tr>' +
                            '<td>' + fmtDate(r.created_at) + '</td>' +
                            '<td>' + esc(r.name) + '</td>' +
                            '<td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td>' +
                            '<td>' + (CATEGORY_LABELS[r.category] || esc(r.category)) + '</td>' +
                            '<td class="msg-cell">' + esc(r.message) + '</td>' +
                            '<td>' + statusSelectHtml(r) + '</td>' +
                            '</tr>';
                    });
                }
                tableEl.innerHTML = html + '</tbody>';

                tableEl.querySelectorAll('.status-select').forEach(function (sel) {
                    sel.addEventListener('change', async function () {
                        const { error } = await supabaseClient.from(currentTab)
                            .update({ status: sel.value }).eq('id', sel.dataset.id);
                        if (error) {
                            alert('상태 변경 실패: ' + error.message);
                        } else {
                            sel.className = 'status-select status-' + sel.value;
                        }
                    });
                });
            }

            // ---------- CSV ----------
            document.getElementById('csv-btn').addEventListener('click', function () {
                if (!currentRows.length) return;
                const cols = Object.keys(currentRows[0]);
                const lines = [cols.join(',')];
                currentRows.forEach(function (r) {
                    lines.push(cols.map(function (c) {
                        const v = r[c] == null ? '' : String(r[c]);
                        return '"' + v.replace(/"/g, '""') + '"';
                    }).join(','));
                });
                const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = currentTab + '_' + new Date().toISOString().slice(0, 10) + '.csv';
                a.click();
                URL.revokeObjectURL(a.href);
            });

            // ---------- Tabs & Filters ----------
            document.querySelectorAll('.admin-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('.admin-tab').forEach(function (t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    trackFilter.style.display = currentTab === 'applications' ? '' : 'none';
                    loadData();
                });
            });
            trackFilter.addEventListener('change', loadData);
            document.getElementById('status-filter').addEventListener('change', loadData);
            document.getElementById('refresh-btn').addEventListener('click', loadData);

            checkSession();
        })();
    </script>
</body>

</html>

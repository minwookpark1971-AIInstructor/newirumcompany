<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>연결 승인 | Irum Academy</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { background: var(--bg, #fff); }
        .consent { max-width: 460px; margin: 12vh auto; padding: 0 20px; }
        .consent h1 { font-size: 22px; margin-bottom: 8px; }
        .consent p { color: #555; line-height: 1.6; }
        .consent .box { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px 18px; margin: 18px 0; }
        .consent .box dt { font-size: 12px; color: #888; margin-top: 8px; }
        .consent .box dd { margin: 2px 0 0; font-weight: 600; word-break: break-all; }
        .consent .actions { display: flex; gap: 8px; }
        .consent .actions .btn { flex: 1; }
        .consent .err { color: #c0392b; margin-top: 12px; }
    </style>
</head>

<body>
    <main class="consent">
        <h1>사이트 편집 연결 승인</h1>
        <p id="status">확인 중…</p>

        <form id="login-form" hidden>
            <p>관리자 계정으로 로그인해 주세요.</p>
            <div class="form-group">
                <label class="form-label" for="email">이메일</label>
                <input type="email" class="form-input" id="email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">비밀번호</label>
                <input type="password" class="form-input" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </form>

        <section id="consent" hidden>
            <p>아래 앱이 관리자 권한으로 사이트의 문구·프로그램·신청/문의를 조회하고 수정하려고 합니다. 직접 연결한 것이 아니라면 거부하세요.</p>
            <dl class="box">
                <dt>앱</dt>
                <dd id="client-name"></dd>
                <dt>요청 권한</dt>
                <dd id="scopes"></dd>
                <dt>로그인 계정</dt>
                <dd id="account"></dd>
            </dl>
            <div class="actions">
                <button class="btn btn-outline" id="deny">거부</button>
                <button class="btn btn-primary" id="approve">승인</button>
            </div>
        </section>

        <p class="err" id="error" hidden></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script>
        (function () {
            const statusEl = document.getElementById('status');
            const errorEl = document.getElementById('error');
            const loginForm = document.getElementById('login-form');
            const consentEl = document.getElementById('consent');
            const authorizationId = new URLSearchParams(location.search).get('authorization_id');

            function fail(msg) {
                statusEl.hidden = true;
                loginForm.hidden = true;
                consentEl.hidden = true;
                errorEl.textContent = msg;
                errorEl.hidden = false;
            }

            function go(url) {
                // 인증 서버가 준 리디렉션 주소로만 이동 (http/https)
                if (/^https?:\/\//i.test(url)) { location.href = url; } else { fail('올바르지 않은 리디렉션 주소입니다.'); }
            }

            async function start() {
                if (!authorizationId) { fail('잘못된 요청입니다 (authorization_id 없음).'); return; }
                if (!supabaseClient.auth.oauth) { fail('이 브라우저의 Supabase 라이브러리가 OAuth 서버 API 를 지원하지 않습니다.'); return; }

                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    statusEl.hidden = true;
                    loginForm.hidden = false;
                    return;
                }

                const { data: isAdmin } = await supabaseClient.rpc('is_admin');
                if (isAdmin !== true) { fail('관리자로 등록되지 않은 계정입니다. 다른 계정으로 로그인하려면 관리자 페이지에서 로그아웃하세요.'); return; }

                const { data, error } = await supabaseClient.auth.oauth.getAuthorizationDetails(authorizationId);
                if (error || !data) { fail('승인 요청을 불러오지 못했습니다: ' + (error ? error.message : '')); return; }
                if (data.redirect_url) { go(data.redirect_url); return; } // 이미 승인된 요청

                document.getElementById('client-name').textContent = (data.client && data.client.name) || '알 수 없는 앱';
                document.getElementById('scopes').textContent = (data.scope || '').split(' ').filter(Boolean).join(', ') || '기본';
                document.getElementById('account').textContent = session.user.email;
                statusEl.hidden = true;
                consentEl.hidden = false;
            }

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                errorEl.hidden = true;
                const { error } = await supabaseClient.auth.signInWithPassword({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                });
                if (error) { errorEl.textContent = '로그인 실패: ' + error.message; errorEl.hidden = false; return; }
                loginForm.hidden = true;
                statusEl.hidden = false;
                start();
            });

            document.getElementById('approve').addEventListener('click', async function () {
                const { data, error } = await supabaseClient.auth.oauth.approveAuthorization(authorizationId);
                if (error || !data) { fail('승인 실패: ' + (error ? error.message : '')); return; }
                go(data.redirect_url || data.redirect_to);
            });

            document.getElementById('deny').addEventListener('click', async function () {
                const { data, error } = await supabaseClient.auth.oauth.denyAuthorization(authorizationId);
                if (error || !data) { fail('거부 처리 실패: ' + (error ? error.message : '')); return; }
                go(data.redirect_url || data.redirect_to);
            });

            start();
        })();
    </script>
</body>

</html>
